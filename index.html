<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d2a26">
  <meta name="description" content="行きと帰りで速さが違う5つのコマを操り、先に4つ上がらせたら勝ちの盤ゲーム。">
  <title>squadro — 5人のコマで走る陣取り</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="squadro">
  <meta property="og:title" content="squadro — 5人のコマで走る陣取り">
  <meta property="og:description" content="行きと帰りで速さが違う5つのコマを操り、先に4つ上がらせたら勝ちの盤ゲーム。">
  <meta property="og:url" content="https://t-of.github.io/squadro/">
  <meta property="og:image" content="https://t-of.github.io/squadro/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="squadro">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">squadro</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div id="start" class="screen">
        <h2 class="title">squadro</h2>
        <p class="sub">行き帰りで速さが違う5つのコマ。先に4つ上がらせたら勝ち</p>
        <div class="strength" id="strength">
          <span class="strength__label">CPU の強さ</span>
          <div class="strength__opts">
            <label><input type="radio" name="strength" value="weak">よわい</label>
            <label><input type="radio" name="strength" value="normal">ふつう</label>
            <label><input type="radio" name="strength" value="max" checked>最強</label>
          </div>
        </div>
        <button class="pill pill--big" data-start="cpu-a">CPU と対戦（先手）</button>
        <button class="pill pill--big" data-start="cpu-b">CPU と対戦（後手）</button>
        <button class="pill pill--big" data-start="pvp">2人で対戦（同じ端末）</button>
      </div>

      <div id="game" class="screen screen--game" hidden>
        <div class="info">
          <span class="info__score">黄 上がり <b id="scoreA">0</b>/4</span>
          <span class="info__turn" id="turnLabel"></span>
          <span class="info__score">赤 上がり <b id="scoreB">0</b>/4</span>
        </div>

        <div class="board3d" id="board3d"></div>

        <p class="hint">ドラッグで回す・ピンチで寄る・自分のコマをタップして進める</p>
      </div>

      <div id="result" class="screen overlay" hidden>
        <h2 id="resultText"></h2>
        <button class="pill pill--big" id="againBtn">もう一度</button>
        <button class="pill" id="titleBtn">タイトルへ</button>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> ／ <a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./rules.js"></script>
  <script src="./ai.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
